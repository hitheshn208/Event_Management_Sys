services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=admin
      - POSTGRES_USER=admin
      - POSTGRES_DB=event_hub
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:

  # docker exec cont_id -it postgres psql -U admin -d event_hub